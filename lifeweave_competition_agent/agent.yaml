name: "LIFEWEAVE Gemma 4 Developer Agent"
version: "1.0.0"
model: gemma-4-31b-it-qat-w4a16-ct
description: "Repository-agnostic evidence-guided autonomous software engineering agent for defect localization, minimal patching, invariant validation, and failure recovery."

tools:
  - run_command
  - read_file
  - write_file
  - edit_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph

prompts:
  system: prompts/system.md
  analyzer: prompts/analyzer.md

skills:
  - skills/lifeweave/SKILL.md

configs:
  sampling: configs/sampling.yaml
